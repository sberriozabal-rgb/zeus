    <script>
        const historias = {
            es: { t: "Lina y el Bosque Mágico", s: "Una aventura de amistad y valentía", c: [
                { n: "El Descubrimiento", e: "🦊🏠", tx: "Lina era una pequeña zorra pelirroja que vivía al borde del bosque. Cada mañana miraba desde su madriguera, pero tenía un poco de miedo de explorar ese lugar grande y desconocido.", m: "✨ A veces, lo que nos da miedo es exactamente lo que necesitamos descubrir.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop", fin: "✨ Sé valiente aunque tengas miedo" },
                { n: "El Primer Paso", e: "🦊👣🌳", tx: "Un día, Lina tomó una gran respiración y decidió caminar hacia el bosque. Sus pequeñas patitas crujían en las hojas secas. El sol filtraba luz dorada entre los árboles. ¡Era hermoso!", m: "💪 La valentía no significa no tener miedo, significa actuar a pesar del miedo.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop", fin: "💪 Los problemas se resuelven mejor juntos" },
                { n: "Un Nuevo Amigo", e: "🐰🦊💛", tx: "Junto a un árbol enorme, Lina encontró a Conejo, quien estaba llorando. \"¡Perdí mi zanahoria dorada!\", sollozó. Sin pensarlo dos veces, Lina dijo: \"¡Te ayudaré a encontrarla!\"", m: "🤝 Ayudar a otros es lo que hace verdaderos amigos.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop", fin: "🤝 Ayuda a otros sin esperar nada a cambio" },
                { n: "La Aventura Comienza", e: "🦊🐰🗺️✨", tx: "Juntos, caminaron más profundo en el bosque. Pasaron por arroyos cristalinos, bajo puentes de lianas y entre flores brillantes. Cada paso era una nueva sorpresa. \"¡Mira, Lina! ¡Esto es increíble!\", gritaba Conejo feliz.", m: "🌈 Los momentos especiales se hacen más especiales cuando los compartimos con amigos.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop", fin: "🌈 Las aventuras reales están en la amistad" },
                { n: "El Desafío", e: "🦊😰❓", tx: "De pronto, llegaron a un río ancho y rápido. \"¿Cómo cruzamos?\", preguntó Conejo asustado. Lina miró alrededor... y vio piedras grandes en el agua. \"¡Saltaremos de piedra en piedra!\", propuso con confianza.", m: "🧠 Cuando parece que no hay solución, mira mejor. Siempre hay un camino.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Trabajar Juntos", e: "🦊🐰🤝💪", tx: "Lina saltó primero a la primera piedra. \"¡Vamos, Conejo! ¡Puedes hacerlo!\" Conejo saltó, un poco asustado, pero Lina le dio la pata para ayudarlo. Juntos, piedra a piedra, cruzaron el río. \"¡Lo logramos!\", celebraron.", m: "👥 No es más fuerte quien puede hacer todo solo, sino quien hace equipo.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "El Hallazgo Especial", e: "✨🥕💫🌟", tx: "Al cruzar el río, encontraron un claro mágico lleno de flores doradas. En el centro, brillaba la zanahoria de Conejo, rodeada de luz dorada. \"¡Ahí está!\", gritó Conejo corriendo hacia ella.", m: "🎯 Las cosas perdidas a menudo se encuentran cuando dejamos de solo buscar y disfrutamos el camino.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "El Final Feliz", e: "🦊🐰🥕🌅❤️", tx: "Mientras el sol se ponía en el horizonte, Lina y Conejo se sentaron juntos en una rama. \"Gracias por ser mi amiga\", dijo Conejo abrazando a Lina. \"Fuiste muy valiente hoy\". Y Lina sonrió, sabiendo que había descubierto algo más valioso que cualquier zanahoria: ¡una amistad verdadera!", m: "💝 La verdadera magia no está en los bosques, sino en los corazones de nuestros amigos.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "¡FIN!", fin_l: ["✨ Sé valiente aunque tengas miedo", "🤝 Ayuda a otros sin esperar nada a cambio", "💪 Los problemas se resuelven mejor juntos", "🌈 Las aventuras reales están en la amistad"]},
            en: { t: "Lina and the Magical Forest", s: "An adventure of friendship and courage", c: [
                { n: "The Discovery", e: "🦊🏠", tx: "Lina was a small red fox living on the edge of the forest. Every morning she looked from her burrow, but she was a little afraid to explore this big, unknown place.", m: "✨ Sometimes what scares us is exactly what we need to discover.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "The First Step", e: "🦊👣🌳", tx: "One day, Lina took a deep breath and decided to walk into the forest. Her little paws crunched on dry leaves. Golden sunlight filtered through the trees. It was beautiful!", m: "💪 Courage doesn't mean being fearless, it means acting despite the fear.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "A New Friend", e: "🐰🦊💛", tx: "Next to a huge tree, Lina found Rabbit, who was crying. \"I lost my golden carrot!\" he sobbed. Without thinking, Lina said: \"I'll help you find it!\"", m: "🤝 Helping others is what makes true friends.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "The Adventure Begins", e: "🦊🐰🗺️✨", tx: "Together, they walked deeper into the forest. They passed crystal-clear streams, under vine bridges and among bright flowers. Each step was a new surprise. \"Look, Lina! This is amazing!\" cheered Rabbit.", m: "🌈 Special moments become even more special when we share them with friends.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "The Challenge", e: "🦊😰❓", tx: "Suddenly, they came to a wide, rushing river. \"How do we cross?\" asked scared Rabbit. Lina looked around... and saw big stones in the water. \"We'll jump from stone to stone!\" she proposed confidently.", m: "🧠 When there seems to be no solution, look closer. There's always a way.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Working Together", e: "🦊🐰🤝💪", tx: "Lina jumped first to the first stone. \"Come on, Rabbit! You can do it!\" Rabbit jumped, a bit scared, but Lina gave him her paw to help. Together, stone by stone, they crossed the river. \"We did it!\" they celebrated.", m: "👥 The strongest is not who can do everything alone, but who forms a team.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "The Special Discovery", e: "✨🥕💫🌟", tx: "After crossing the river, they found a magical clearing full of golden flowers. In the center, shone Rabbit's carrot, surrounded by golden light. \"There it is!\" shouted Rabbit running towards it.", m: "🎯 Lost things are often found when we stop searching and enjoy the journey.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "The Happy Ending", e: "🦊🐰🥕🌅❤️", tx: "As the sun set on the horizon, Lina and Rabbit sat together on a branch. \"Thank you for being my friend\" said Rabbit hugging Lina. \"You were very brave today\". And Lina smiled, knowing she had discovered something more valuable than any carrot: true friendship!", m: "💝 True magic is not in forests, but in the hearts of our friends.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "THE END!", fin_l: ["✨ Be brave even when you're scared", "🤝 Help others without expecting anything in return", "💪 Problems are solved better together", "🌈 Real adventures are in friendship"]},
            fr: { t: "Lina et la Forêt Magique", s: "Une aventure d'amitié et de courage", c: [
                { n: "La Découverte", e: "🦊🏠", tx: "Lina était une petite renard roux qui vivait au bord de la forêt. Chaque matin, elle regardait depuis son terrier, mais elle avait un peu peur d'explorer ce grand endroit inconnu.", m: "✨ Parfois, ce qui nous fait peur est exactement ce que nous devons découvrir.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Le Premier Pas", e: "🦊👣🌳", tx: "Un jour, Lina prit une grande respiration et décida de marcher vers la forêt. Ses petites pattes craquaient dans les feuilles sèches. La lumière dorée du soleil filtrait entre les arbres. C'était magnifique!", m: "💪 Le courage ne signifie pas ne pas avoir peur, cela signifie agir malgré la peur.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Un Nouvel Ami", e: "🐰🦊💛", tx: "Près d'un arbre énorme, Lina trouva Lapin, qui pleurait. \"J'ai perdu ma carotte dorée!\", sanglota-t-il. Sans hésiter, Lina dit: \"Je t'aiderai à la trouver!\"", m: "🤝 Aider les autres, c'est ce qui fait les vrais amis.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "L'Aventure Commence", e: "🦊🐰🗺️✨", tx: "Ensemble, ils marchaient plus profondément dans la forêt. Ils ont traversé des ruisseaux cristallins, sous des ponts de lianes et parmi des fleurs brillantes. Chaque pas était une nouvelle surprise. \"Regarde, Lina! C'est incroyable!\", cria joyeusement Lapin.", m: "🌈 Les moments spéciaux deviennent encore plus spéciaux quand nous les partageons avec des amis.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "Le Défi", e: "🦊😰❓", tx: "Soudain, ils arrivèrent à une rivière large et rapide. \"Comment traversons-nous?\", demanda Lapin effrayé. Lina regarda autour... et vit de grandes pierres dans l'eau. \"Nous sauterons de pierre en pierre!\", proposa-t-elle avec confiance.", m: "🧠 Quand il semble qu'il n'y a pas de solution, regarde mieux. Il y a toujours un chemin.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Travailler Ensemble", e: "🦊🐰🤝💪", tx: "Lina sauta d'abord sur la première pierre. \"Allez, Lapin! Tu peux le faire!\" Lapin sauta, un peu effrayé, mais Lina lui donna sa patte pour l'aider. Ensemble, pierre après pierre, ils traversèrent la rivière. \"Nous l'avons fait!\", célébrèrent-ils.", m: "👥 Le plus fort n'est pas celui qui peut tout faire seul, mais celui qui fait équipe.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "La Découverte Spéciale", e: "✨🥕💫🌟", tx: "En traversant la rivière, ils trouvèrent une clairière magique remplie de fleurs dorées. Au centre, brillait la carotte de Lapin, entourée de lumière dorée. \"La voilà!\", cria Lapin en courant vers elle.", m: "🎯 Les choses perdues se trouvent souvent quand nous arrêtons de chercher et profitons du voyage.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "La Fin Heureuse", e: "🦊🐰🥕🌅❤️", tx: "Alors que le soleil se couchait à l'horizon, Lina et Lapin s'assirent ensemble sur une branche. \"Merci d'être mon amie\", dit Lapin en serrant Lina dans ses bras. \"Tu as été très brave aujourd'hui\". Et Lina sourit, sachant qu'elle avait découvert quelque chose de plus précieux que n'importe quelle carotte: une véritable amitié!", m: "💝 La vraie magie n'est pas dans les forêts, mais dans les cœurs de nos amis.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "FIN!", fin_l: ["✨ Sois courageux même quand tu as peur", "🤝 Aide les autres sans attendre en retour", "💪 Les problèmes se résolvent mieux ensemble", "🌈 Les vraies aventures sont dans l'amitié"]},
            de: { t: "Lina und der magische Wald", s: "Ein Abenteuer von Freundschaft und Mut", c: [
                { n: "Die Entdeckung", e: "🦊🏠", tx: "Lina war ein kleiner rotfüchsiger Fuchs, der am Rande des Waldes lebte. Jeden Morgen schaute sie aus ihrem Bau, aber sie hatte ein wenig Angst, diesen großen, unbekannten Ort zu erkunden.", m: "✨ Manchmal ist genau das, was uns Angst macht, genau das, was wir entdecken müssen.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Der erste Schritt", e: "🦊👣🌳", tx: "Eines Tages holte Lina tief Luft und beschloss, in den Wald zu gehen. Ihre kleinen Pfoten knisterten in den trockenen Blättern. Goldenes Sonnenlicht flimmerte durch die Bäume. Es war wunderschön!", m: "💪 Mut bedeutet nicht, keine Angst zu haben, sondern trotz der Angst zu handeln.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Ein neuer Freund", e: "🐰🦊💛", tx: "Neben einem riesigen Baum fand Lina Kaninchen, der weinte. \"Ich habe meine goldene Karotte verloren!\", schluchzte er. Ohne nachzudenken sagte Lina: \"Ich helfe dir, sie zu finden!\"", m: "🤝 Anderen zu helfen ist das, was echte Freunde ausmacht.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "Das Abenteuer beginnt", e: "🦊🐰🗺️✨", tx: "Zusammen gingen sie tiefer in den Wald. Sie passierten kristallklare Bäche, unter Lianenbrücken und zwischen leuchtenden Blumen hindurch. Jeder Schritt war eine neue Überraschung. \"Schau, Lina! Das ist unglaublich!\", rief Kaninchen fröhlich.", m: "🌈 Besondere Momente werden noch spezieller, wenn wir sie mit Freunden teilen.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "Die Herausforderung", e: "🦊😰❓", tx: "Plötzlich kamen sie zu einem breiten, schnellen Fluss. \"Wie überqueren wir das?\", fragte ängsliches Kaninchen. Lina schaute sich um... und sah große Steine im Wasser. \"Wir springen von Stein zu Stein!\", schlug sie selbstbewusst vor.", m: "🧠 Wenn es keine Lösung zu geben scheint, schau genauer hin. Es gibt immer einen Weg.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Gemeinsam arbeiten", e: "🦊🐰🤝💪", tx: "Lina sprang zuerst auf den ersten Stein. \"Los, Kaninchen! Du schaffst das!\" Kaninchen sprang, ein wenig verängstigt, aber Lina gab ihm ihre Pfote zum Helfen. Gemeinsam, Stein für Stein, überquerten sie den Fluss. \"Wir haben es geschafft!\", feierten sie.", m: "👥 Der Stärkste ist nicht, wer alles allein tun kann, sondern wer ein Team bildet.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "Die spezielle Entdeckung", e: "✨🥕💫🌟", tx: "Nach dem Überqueren des Flusses fanden sie eine magische Lichtung voller goldener Blumen. In der Mitte leuchtete Kaninchens Karotte, umgeben von goldenem Licht. \"Da ist sie!\", rief Kaninchen und lief auf sie zu.", m: "🎯 Verlorene Dinge werden oft gefunden, wenn wir aufhören zu suchen und die Reise genießen.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "Das Happy End", e: "🦊🐰🥕🌅❤️", tx: "Während die Sonne am Horizont unterging, saßen Lina und Kaninchen zusammen auf einem Ast. \"Danke, dass du meine Freundin bist\", sagte Kaninchen und umarmte Lina. \"Du warst heute sehr mutig\". Und Lina lächelte, wissend, dass sie etwas wertvolleres als jede Karotte entdeckt hatte: wahre Freundschaft!", m: "💝 Die wahre Magie liegt nicht in Wäldern, sondern in den Herzen unserer Freunde.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "ENDE!", fin_l: ["✨ Sei mutig, auch wenn dir Angst ist", "🤝 Hilf anderen, ohne etwas dafür zu erwarten", "💪 Probleme werden zusammen besser gelöst", "🌈 Echte Abenteuer sind in der Freundschaft"]},
            pt_br: { t: "Lina e a Floresta Mágica", s: "Uma aventura de amizade e coragem", c: [
                { n: "A Descoberta", e: "🦊🏠", tx: "Lina era uma pequena raposa vermelha que vivia à beira da floresta. Cada manhã ela olhava de sua toca, mas tinha um pouco de medo de explorar esse grande lugar desconhecido.", m: "✨ Às vezes, o que nos assusta é exatamente o que precisamos descobrir.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "O Primeiro Passo", e: "🦊👣🌳", tx: "Um dia, Lina respirou fundo e decidiu caminhar para a floresta. Suas pequenas patas chiavam nas folhas secas. A luz solar dourada filtrava pelas árvores. Era lindo!", m: "💪 Coragem não significa não ter medo, significa agir apesar do medo.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Um Novo Amigo", e: "🐰🦊💛", tx: "Ao lado de uma árvore enorme, Lina encontrou Coelho, que estava chorando. \"Perdi minha cenoura dourada!\", soluçou. Sem pensar, Lina disse: \"Vou ajudá-lo a encontrá-la!\"", m: "🤝 Ajudar os outros é o que faz verdadeiros amigos.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "A Aventura Começa", e: "🦊🐰🗺️✨", tx: "Juntos, caminharam mais profundamente na floresta. Passaram por riachos cristalinos, sob pontes de cipós e entre flores brilhantes. Cada passo era uma nova surpresa. \"Olha, Lina! Isto é incrível!\", gritava Coelho feliz.", m: "🌈 Momentos especiais ficam ainda mais especiais quando os compartilhamos com amigos.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "O Desafio", e: "🦊😰❓", tx: "De repente, chegaram a um rio largo e rápido. \"Como atravessamos?\", perguntou Coelho assustado. Lina olhou ao redor... e viu grandes pedras na água. \"Vamos pular de pedra em pedra!\", propôs confiante.", m: "🧠 Quando parece que não há solução, olhe melhor. Sempre há um caminho.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Trabalhar Juntos", e: "🦊🐰🤝💪", tx: "Lina pulou primeiro para a primeira pedra. \"Vamos, Coelho! Você consegue!\" Coelho pulou, um pouco assustado, mas Lina lhe deu a pata para ajudar. Juntos, pedra após pedra, atravessaram o rio. \"Conseguimos!\", comemoraram.", m: "👥 O mais forte não é quem pode fazer tudo sozinho, mas quem trabalha em equipe.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "A Descoberta Especial", e: "✨🥕💫🌟", tx: "Ao atravessar o rio, encontraram uma clareira mágica cheia de flores douradas. No centro, brilhava a cenoura de Coelho, cercada por luz dourada. \"Lá está!\", gritou Coelho correndo para ela.", m: "🎯 As coisas perdidas são frequentemente encontradas quando paramos de buscar e curtimos a jornada.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "O Final Feliz", e: "🦊🐰🥕🌅❤️", tx: "Enquanto o sol se punha no horizonte, Lina e Coelho se sentaram juntos em um galho. \"Obrigado por ser minha amiga\", disse Coelho abraçando Lina. \"Você foi muito corajosa hoje\". E Lina sorriu, sabendo que tinha descoberto algo mais valioso que qualquer cenoura: uma verdadeira amizade!", m: "💝 A verdadeira magia não está nas florestas, mas nos corações de nossos amigos.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "FIM!", fin_l: ["✨ Seja corajoso mesmo quando tem medo", "🤝 Ajude os outros sem esperar nada em troca", "💪 Problemas são resolvidos melhor juntos", "🌈 Aventuras reais estão na amizade"]},

            it: { t: "Lina e la Foresta Magica", s: "Un'avventura di amicizia e coraggio", c: [
                { n: "La Scoperta", e: "🦊🏠", tx: "Lina era una piccola volpe rossa che viveva al margine della foresta. Ogni mattina guardava dalla sua tana, ma aveva un po' di paura di esplorare questo grande e sconosciuto posto.", m: "✨ A volte, quello che ci spaventa è esattamente quello che abbiamo bisogno di scoprire.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Il Primo Passo", e: "🦊👣🌳", tx: "Un giorno, Lina respirò profondamente e decise di camminare verso la foresta. Le sue piccole zampe scricchiolavano nelle foglie secche. La luce dorata del sole filtrava tra gli alberi. Era bellissimo!", m: "💪 Il coraggio non significa non avere paura, significa agire nonostante la paura.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Un Nuovo Amico", e: "🐰🦊💛", tx: "Accanto a un enorme albero, Lina trovò Coniglio, che stava piangendo. \"Ho perso la mia carota d'oro!\", singhiozzò. Senza pensarci, Lina disse: \"Ti aiuterò a trovarla!\"", m: "🤝 Aiutare gli altri è quello che rende veri amici.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "L'Avventura Inizia", e: "🦊🐰🗺️✨", tx: "Insieme, camminarono più profondamente nella foresta. Passarono per ruscelli cristallini, sotto ponti di liane e tra fiori brillanti. Ogni passo era una nuova sorpresa. \"Guarda, Lina! È incredibile!\", gridava allegramente Coniglio.", m: "🌈 I momenti speciali diventano ancora più speciali quando li condividiamo con gli amici.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "La Sfida", e: "🦊😰❓", tx: "Improvvisamente, arrivarono a un fiume largo e veloce. \"Come attraversiamo?\", chiese Coniglio spaventato. Lina guardò intorno... e vide grandi pietre nell'acqua. \"Salteremo da pietra a pietra!\", propose con sicurezza.", m: "🧠 Quando sembra che non ci sia una soluzione, guarda meglio. C'è sempre un modo.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Lavorare Insieme", e: "🦊🐰🤝💪", tx: "Lina saltò per prima sulla prima pietra. \"Dai, Coniglio! Puoi farcela!\" Coniglio saltò, un po' spaventato, ma Lina gli diede la zampa per aiutarlo. Insieme, pietra dopo pietra, attraversarono il fiume. \"Ce l'abbiamo fatta!\", celebrarono.", m: "👥 Il più forte non è chi può fare tutto da solo, ma chi fa squadra.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "La Scoperta Speciale", e: "✨🥕💫🌟", tx: "Dopo aver attraversato il fiume, trovarono una radura magica piena di fiori d'oro. Al centro, brillava la carota di Coniglio, circondata da luce dorata. \"Eccola!\", gridò Coniglio correndo verso di essa.", m: "🎯 Le cose perdute si trovano spesso quando smettiamo di cercare e apprezziamo il viaggio.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "Il Finale Felice", e: "🦊🐰🥕🌅❤️", tx: "Mentre il sole tramontava all'orizzonte, Lina e Coniglio si sedettero insieme su un ramo. \"Grazie per essere la mia amica\", disse Coniglio abbracciando Lina. \"Sei stata molto coraggiosa oggi\". E Lina sorrise, sapendo di aver scoperto qualcosa di più prezioso di qualsiasi carota: una vera amicizia!", m: "💝 La vera magia non è nelle foreste, ma nei cuori dei nostri amici.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "FINE!", fin_l: ["✨ Sii coraggioso anche quando hai paura", "🤝 Aiuta gli altri senza aspettarti nulla in cambio", "💪 I problemi si risolvono meglio insieme", "🌈 Le vere avventure sono nell'amicizia"]},
            ru: { t: "Лина и Волшебный Лес", s: "Приключение дружбы и смелости", c: [
                { n: "Открытие", e: "🦊🏠", tx: "Лина была маленькой рыжей лисой, которая жила на краю леса. Каждое утро она смотрела из своей норы, но боялась исследовать это большое неизвестное место.", m: "✨ Иногда то, что нас пугает, - это именно то, что нам нужно открыть.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Первый Шаг", e: "🦊👣🌳", tx: "Однажды Лина глубоко вздохнула и решила пойти в лес. Её маленькие лапки хрустели в сухих листьях. Золотой солнечный свет просачивался сквозь деревья. Это было прекрасно!", m: "💪 Смелость не означает отсутствие страха, это означает действовать несмотря на страх.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Новый Друг", e: "🐰🦊💛", tx: "Рядом с огромным деревом Лина нашла Кролика, который плакал. \"Я потеряла свою золотую морковь!\", рыдал он. Не раздумывая, Лина сказала: \"Я помогу тебе её найти!\"", m: "🤝 Помощь другим - это то, что делает настоящих друзей.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "Приключение Начинается", e: "🦊🐰🗺️✨", tx: "Вместе они прошли глубже в лес. Они прошли мимо кристально чистых ручьёв, под виноградными мостами и среди ярких цветов. Каждый шаг был новым сюрпризом. \"Смотри, Лина! Это невероятно!\", кричал весёлый Кролик.", m: "🌈 Особые моменты становятся ещё более особенными, когда мы делим их с друзьями.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "Испытание", e: "🦊😰❓", tx: "Внезапно они пришли к широкой быстрой реке. \"Как нам её перейти?\", спросил испуганный Кролик. Лина посмотрела вокруг... и увидела большие камни в воде. \"Мы прыгнём с камня на камень!\", предложила она уверенно.", m: "🧠 Когда кажется, что решения нет, смотри внимательнее. Всегда есть путь.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Работать Вместе", e: "🦊🐰🤝💪", tx: "Лина первой прыгнула на первый камень. \"Давай, Кролик! Ты можешь!\", - скала Лина. Кролик прыгнул, немного испугавшись, но Лина подала ему лапку для помощи. Вместе, камень за камнем, они перейдили реку. \"Мы сделали это!\", праздновали они.", m: "👥 Самый сильный - не тот, кто может всё делать один, а тот, кто работает в команде.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "Особенное Открытие", e: "✨🥕💫🌟", tx: "Переплыв реку, они нашли волшебную поляну, полную золотых цветов. В центре сияла морковь Кролика, окруженная золотым светом. \"Вот она!\", - закричал Кролик, бегя к ней.", m: "🎯 Потерянные вещи часто находят, когда мы перестаём искать и наслаждаемся путешествием.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "Счастливый Конец", e: "🦊🐰🥕🌅❤️", tx: "Пока солнце садилось на горизонте, Лина и Кролик сидели вместе на ветке. \"Спасибо, что ты моя подруга\", - сказал Кролик, обнимая Лину. \"Ты была очень смелой сегодня\". И Лина улыбнулась, зная, что открыла что-то более ценное, чем любая морковь: настоящую дружбу!", m: "💝 Настоящая магия не в лесах, а в сердцах наших друзей.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "КОНЕЦ!", fin_l: ["✨ Будь смелым, даже когда боишься", "🤝 Помогай другим, не ожидая ничего взамен", "💪 Проблемы решаются лучше вместе", "🌈 Настоящие приключения в дружбе"]},
            zh: { t: "丽娜和魔法森林", s: "一场友谊和勇气的冒险", c: [
                { n: "发现", e: "🦊🏠", tx: "丽娜是一只住在森林边缘的小红狐狸。每天早上她都从自己的洞里看出来，但她有点害怕探索这个陌生的大地方。", m: "✨ 有时候，让我们害怕的东西正是我们需要发现的。", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "第一步", e: "🦊👣🌳", tx: "有一天，丽娜深吸一口气，决定走进森林。她的小爪子在干叶子上嘎吱嘎吱地踩着。金色的阳光透过树木流泻下来。太美了！", m: "💪 勇气不是没有恐惧，而是尽管害怕也要行动。", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "新朋友", e: "🐰🦊💛", tx: "在一棵巨大的树旁，丽娜发现了兔子，它在哭泣。\"我失去了我的金色胡萝卜！\"它抽泣道。丽娜没有多想就说：\"我会帮你找到它！\"", m: "🤝 帮助别人就是真正的朋友所做的。", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "冒险开始", e: "🦊🐰🗺️✨", tx: "他们一起更深入地走进了森林。他们经过了清澈的小溪，越过了藤蔓桥，穿过了明亮的花朵。每一步都是新的惊喜。\"看，丽娜！这太不可思议了！\"兔子高兴地叫道。", m: "🌈 当我们和朋友分享特殊时刻时，它们变得更加特殊。", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "挑战", e: "🦊😰❓", tx: "突然，他们来到了一条宽阔的急速河流。\"我们怎么过去？\"害怕的兔子问道。丽娜看了看周围...看到水里有大石头。\"我们可以从石头跳到石头！\"她自信地提议。", m: "🧠 当似乎没有解决方案时，更仔细地看。总是有办法的。", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "一起工作", e: "🦊🐰🤝💪", tx: "丽娜先跳到第一块石头。\"来吧，兔子！你可以的！\"兔子跳了下来，有点害怕，但丽娜给了他她的爪子来帮忙。一起，一块石头接一块石头，他们过了河。\"我们成功了！\"他们庆祝道。", m: "👥 最强的不是能独自做一切的人，而是能组成团队的人。", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "特殊发现", e: "✨🥕💫🌟", tx: "过了河后，他们发现了一个充满金色花朵的魔法空地。中心处闪烁着兔子的胡萝卜，周围笼罩着金色的光芒。\"在那里！\"兔子大叫着跑向它。", m: "🎯 当我们停止寻找并享受旅程时，失去的东西往往被找到。", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "幸福结局", e: "🦊🐰🥕🌅❤️", tx: "太阳在地平线上落下时，丽娜和兔子坐在一根树枝上。\"谢谢你做我的朋友，\"兔子说着抱住丽娜。\"你今天很勇敢\"。丽娜微笑着，知道她发现了比任何胡萝卜都更宝贵的东西：真正的友谊！", m: "💝 真正的魔法不在森林里，而在我们朋友的心里。", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "结束！", fin_l: ["✨ 即使害怕也要勇敢", "🤝 帮助他人不求回报", "💪 问题一起解决更好", "🌈 真正的冒险在友谊中"]},
            ja: { t: "リナと魔法の森", s: "友情と勇気の冒険", c: [
                { n: "発見", e: "🦊🏠", tx: "リナは森の端に住む小さな赤いキツネでした。毎朝、彼女は自分の巣穴から見ていましたが、この大きな未知の場所を探索することが少し怖かったのです。", m: "✨ 時には、私たちを怖がらせるものが、まさに私たちが発見する必要があるものです。", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "最初の一歩", e: "🦊👣🌳", tx: "ある日、リナは深く息を吸って、森の中を歩くことにしました。彼女の小さな足は乾いた葉でカリカリと音がしました。黄金色の日光が木々の間をふるい落としました。美しかった！", m: "💪 勇気は恐れを持たないことではなく、恐れにもかかわらず行動することです。", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "新しい友達", e: "🐰🦊💛", tx: "巨大な木の近くで、リナは泣いているウサギを見つけました。\"金色のニンジンを失ってしまいました！\"ウサギは泣きました。躊躇わずに、リナは言いました：\"それを見つけるのを手伝ってあげます！\"", m: "🤝 他の人を助けることが本当の友達を作るのです。", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "冒険が始まる", e: "🦊🐰🗺️✨", tx: "二人は一緒に森の奥へと歩きました。彼らは透き通った小川を通り、つるの橋の下をくぐり、明るい花の間を通りました。一歩一歩が新しい驚きでした。\"見て、リナ！これはすごい！\"ウサギは楽しそうに叫びました。", m: "🌈 特別な瞬間は友達と一緒にシェアするとさらに特別になります。", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "チャレンジ", e: "🦊😰❓", tx: "突然、彼らは広く急速な川に到達しました。\"どうやって渡ろうか？\"怖いウサギが聞きました。リナが周りを見て...水の中の大きな石を見ました。\"石から石へ飛び移りましょう！\"彼女は自信を持って提案しました。", m: "🧠 解決策がないように見えるときは、もっとよく見ましょう。常に方法があります。", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "一緒に働く", e: "🦊🐰🤝💪", tx: "リナが最初の石に飛び移りました。\"さあ、ウサギ！頑張ってください！\"ウサギは飛び移り、少し怖かったですが、リナは助けるために彼に足を与えました。一緒に、石から石へ、彼らは川を渡りました。\"やりました！\"彼らは祝いました。", m: "👥 最も強いのは一人で何もかもできる人ではなく、チームを作る人です。", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "特別な発見", e: "✨🥕💫🌟", tx: "川を渡った後、彼らは金色の花でいっぱいの魔法の草原を見つけました。中心では、ウサギのニンジンが金色の光に囲まれて輝いていました。\"そこです！\"ウサギは叫んで走りました。", m: "🎯 失われた物は、探すのを止めて旅を楽しむときしばしば見つかります。", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "ハッピーエンド", e: "🦊🐰🥕🌅❤️", tx: "太陽が地平線に沈む時、リナとウサギは一本の枝の上に一緒に座りました。\"友達になってくれてありがとう\"とウサギはリナを抱きしめて言いました。\"君は今日とても勇敢だった\"。そしてリナは微笑み、どんなニンジンよりも価値のある何かを発見したことを知りました：本当の友情！", m: "💝 本当の魔法は森の中にではなく、私たちの友達の心の中にあります。", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "終わり！", fin_l: ["✨ 怖いときでも勇敢であること", "🤝 見返りを求めずに他の人を助ける", "💪 問題はみんなで一緒に解決できる", "🌈 本当の冒険は友情の中にある"]},
            hi: { t: "लीना और जादुई जंगल", s: "दोस्ती और साहस की एक कहानी", c: [
                { n: "खोज", e: "🦊🏠", tx: "लीना एक छोटी लाल लोमड़ी थी जो जंगल के किनारे रहती थी। हर सुबह वह अपने बिल से बाहर देखती थी, लेकिन इस बड़ी अज्ञात जगह को देखने से थोड़ा डरती थी।", m: "✨ कभी-कभी जो चीजें हमें डराती हैं वही वह चीजें होती हैं जिन्हें हमें खोजने की जरूरत है।", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "पहला कदम", e: "🦊👣🌳", tx: "एक दिन, लीना ने गहरी सांस ली और जंगल की ओर चलने का फैसला किया। उसके छोटे पंजे सूखी पत्तियों पर खरखराते थे। सोने का प्रकाश पेड़ों के बीच से छनता था। यह सुंदर था!", m: "💪 साहस का मतलब बिना डर के नहीं होता, इसका मतलब डर के बावजूद कार्य करना है।", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "एक नया दोस्त", e: "🐰🦊💛", tx: "एक बहुत ही बड़े पेड़ के पास, लीना को खरगोश मिला, जो रो रहा था। \"मैंने अपनी सुनहरी गाजर खो दी!\", खरगोश ने रोते हुए कहा। बिना सोचे समझे, लीना ने कहा: \"मैं तुम्हें इसे खोजने में मदद करूंगी!\"", m: "🤝 दूसरों की मदद करना ही असली दोस्ती है।", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "रोमांच शुरू होता है", e: "🦊🐰🗺️✨", tx: "एक साथ, वे जंगल में गहराई से चले गए। वे क्रिस्टल साफ नदियों, बेलों के पुलों के नीचे और चमकीले फूलों के बीच से गुजरे। हर कदम एक नया आश्चर्य था। \"देखो, लीना! यह अद्भुत है!\", खरगोश खुशी से चिल्लाया।", m: "🌈 विशेष पल और भी विशेष हो जाते हैं जब हम उन्हें दोस्तों के साथ साझा करते हैं।", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "चुनौती", e: "🦊😰❓", tx: "अचानक, वे एक चौड़ी तेज नदी के पास पहुंचे। \"हम कैसे पार करते हैं?\", डरे हुए खरगोश ने पूछा। लीना ने चारों ओर देखा... और पानी में बड़े पत्थर देखे। \"हम पत्थर से पत्थर पर कूदेंगे!\", उसने आत्मविश्वास से प्रस्ताव दिया।", m: "🧠 जब कोई समाधान न हो तो बेहतर देखो। हमेशा कोई रास्ता है।", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "एक साथ काम करना", e: "🦊🐰🤝💪", tx: "लीना पहले पहले पत्थर पर कूदी। \"चलो, खरगोश! तुम कर सकते हो!\" खरगोश कूदा, थोड़ा डरा, लेकिन लीना ने उसकी मदद के लिए अपना पंजा दिया। एक साथ, पत्थर दर पत्थर, वे नदी पार कर गए। \"हमने कर दिया!\", उन्होंने जश्न मनाया।", m: "👥 सबसे मजबूत वह नहीं है जो सब कुछ अकेले कर सकता है, बल्कि जो टीम बनाता है।", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "विशेष खोज", e: "✨🥕💫🌟", tx: "नदी को पार करने के बाद, उन्हें सुनहरे फूलों से भरा एक जादुई खुला मैदान मिला। बीच में, खरगोश की गाजर चमक रही थी, सुनहरी रोशनी से घिरी हुई थी। \"यह वहां है!\", खरगोश चिल्लाया और उसकी ओर दौड़ा।", m: "🎯 खोई हुई चीजें अक्सर तब मिलती हैं जब हम खोजना बंद कर देते हैं और यात्रा का आनंद लेते हैं।", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "खुश अंत", e: "🦊🐰🥕🌅❤️", tx: "जब सूरज क्षितिज पर डूब रहा था, लीना और खरगोश एक शाखा पर बैठे थे। \"मेरी दोस्त होने के लिए धन्यवाद\", खरगोश ने लीना को गले लगाते हुए कहा। \"आप आज बहुत बहादुर थीं\"। और लीना मुस्कुराई, जानते हुए कि उसने किसी भी गाजर से अधिक मूल्यवान कुछ खोजा था: सच्ची दोस्ती!", m: "💝 असली जादू जंगल में नहीं, बल्कि हमारे दोस्तों के दिलों में है।", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "अंत!", fin_l: ["✨ डर होने पर भी साहसी रहो", "🤝 दूसरों की मदद करो, बदले में कुछ न चाहो", "💪 समस्याएं एक साथ हल होती हैं", "🌈 असली रोमांच दोस्ती में है"]},
            ar: { t: "لينا والغابة السحرية", s: "مغامرة الصداقة والشجاعة", c: [
                { n: "الاكتشاف", e: "🦊🏠", tx: "كانت لينا ثعلبة صغيرة حمراء تعيش على حافة الغابة. كل صباح كانت تنظر من جحرها، لكنها كانت خائفة قليلاً من استكشاف هذا المكان الكبير والغريب.", m: "✨ أحياناً ما يخيفنا هو بالضبط ما نحتاج إلى اكتشافه.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "الخطوة الأولى", e: "🦊👣🌳", tx: "في يوم من الأيام، أخذت لينا نفساً عميقاً وقررت المشي نحو الغابة. كانت لاپاها الصغيرة تحفر في الأوراق الجافة. كان الضوء الذهبي يتسرب من خلال الأشجار. كان جميلاً!", m: "💪 الشجاعة لا تعني عدم الخوف، بل تعني التصرف رغم الخوف.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "صديق جديد", e: "🐰🦊💛", tx: "بجانب شجرة ضخمة، وجدت لينا أرنباً يبكي. \"فقدت جزرتي الذهبية!\", قال الأرنب بنحيب. بدون تفكير، قالت لينا: \"سأساعدك في العثور عليها!\"", m: "🤝 مساعدة الآخرين هي ما يجعل الأصدقاء الحقيقيين.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "تبدأ المغامرة", e: "🦊🐰🗺️✨", tx: "معاً، ذهبوا أعمق في الغابة. مروا عبر جداول صافية، تحت جسور الكروم وبين الزهور المضيئة. كل خطوة كانت مفاجأة جديدة. \"انظري يا لينا! هذا مذهل!\", كان الأرنب يصرخ بفرح.", m: "🌈 تصبح اللحظات الخاصة أكثر خصوصية عندما نشاركها مع الأصدقاء.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "التحدي", e: "🦊😰❓", tx: "فجأة وصلوا إلى نهر عريض وسريع. \"كيف نعبر؟\"، سأل الأرنب الخائف. نظرت لينا حولها... ورأت أحجاراً كبيرة في الماء. \"سنقفز من حجر إلى حجر!\", اقترحت بثقة.", m: "🧠 عندما يبدو أنه لا يوجد حل، انظر بشكل أفضل. هناك دائماً طريقة.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "العمل معاً", e: "🦊🐰🤝💪", tx: "قفزت لينا أولاً إلى الحجر الأول. \"هيا يا أرنب! يمكنك فعل ذلك!\" قفز الأرنب، خائفاً قليلاً، لكن لينا أعطته يدها للمساعدة. معاً، حجر تلو الآخر، عبروا النهر. \"فعلنا ذلك!\", احتفلوا.", m: "👥 الأقوى ليس من يستطيع فعل كل شيء بمفرده، بل من يعمل ضمن فريق.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "الاكتشاف الخاص", e: "✨🥕💫🌟", tx: "بعد عبور النهر، وجدوا حقلاً سحرياً مليئاً بالزهور الذهبية. في المركز، كانت جزرة الأرنب تلمع، محاطة بالضوء الذهبي. \"هناك!\", صرخ الأرنب ركضاً نحوها.", m: "🎯 غالباً ما توجد الأشياء المفقودة عندما نتوقف عن البحث ونستمتع برحلتنا.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "النهاية السعيدة", e: "🦊🐰🥕🌅❤️", tx: "بينما كانت الشمس تغيب على الأفق، جلس لينا والأرنب معاً على فرع. \"شكراً لكونك صديقتي\", قال الأرنب وهو يعانق لينا. \"كنت شجاعة جداً اليوم\". وابتسمت لينا، وهي تعلم أنها اكتشفت شيئاً أثمن من أي جزرة: صداقة حقيقية!", m: "💝 السحر الحقيقي ليس في الغابات، بل في قلوب أصدقائنا.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "النهاية!", fin_l: ["✨ كن شجاعاً حتى وإن كنت خائفاً", "🤝 ساعد الآخرين بدون توقع المقابل", "💪 تحل المشاكل بشكل أفضل معاً", "🌈 المغامرات الحقيقية في الصداقة"]},
            ko: { t: "리나와 마법의 숲", s: "우정과 용기의 모험", c: [
                { n: "발견", e: "🦊🏠", tx: "리나는 숲의 가장자리에 살던 작은 여우였습니다. 매일 아침 자신의 굴에서 밖을 보았지만, 이 크고 낯선 곳을 탐험하는 것이 조금 무서웠습니다.", m: "✨ 때로는 우리를 무섭게 하는 것이 정확히 우리가 발견해야 할 것입니다.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "첫 번째 발걸음", e: "🦊👣🌳", tx: "어느 날, 리나는 깊게 숨을 쉬고 숲으로 걸어가기로 결심했습니다. 그녀의 작은 발은 마른 잎 위에서 바스락거렸습니다. 황금빛 햇빛이 나무 사이로 내려왔습니다. 아름다웠습니다!", m: "💪 용기는 두려움이 없다는 뜻이 아니라, 두려움에도 불구하고 행동한다는 뜻입니다.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "새로운 친구", e: "🐰🦊💛", tx: "거대한 나무 옆에서 리나는 우는 토끼를 찾았습니다. \"내 황금 당근을 잃어버렸어요!\", 토끼가 울었습니다. 생각할 여유도 없이, 리나가 말했습니다: \"내가 찾는 것을 도와줄게요!\"", m: "🤝 다른 사람을 돕는 것이 진정한 친구를 만드는 것입니다.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "모험이 시작된다", e: "🦊🐰🗺️✨", tx: "함께, 그들은 숲 더 깊숙이 걸어갔습니다. 그들은 맑은 시냇물을 지나 덩굴다리 아래를 지나고 밝은 꽃들 사이를 지나갔습니다. 매 발걸음이 새로운 놀라움이었습니다. \"봐, 리나! 이건 놀라운데!\", 토끼가 행복하게 외쳤습니다.", m: "🌈 특별한 순간은 친구들과 함께 할 때 더욱 특별해집니다.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "도전", e: "🦊😰❓", tx: "갑자기, 그들은 넓고 빠른 강에 도달했습니다. \"어떻게 건너나요?\", 겁먹은 토끼가 물었습니다. 리나가 주변을 봤습니다... 물 속의 큰 돌들을 봤습니다. \"돌에서 돌로 뛰어갈 거예요!\", 그녀가 자신 있게 제안했습니다.", m: "🧠 해결책이 없어 보일 때는 더 자세히 봅시다. 항상 길이 있습니다.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "함께 일하기", e: "🦊🐰🤝💪", tx: "리나가 먼저 첫 번째 돌로 뛰어올랐습니다. \"와, 토끼! 할 수 있어!\" 토끼도 뛰어올랐지만 조금 무서워했고, 리나가 도움을 주려고 발을 건넸습니다. 함께, 돌에서 돌로, 그들은 강을 건넜습니다. \"해냈어!\", 그들이 축하했습니다.", m: "👥 가장 강한 사람은 모든 것을 혼자 할 수 있는 사람이 아니라 팀을 이루는 사람입니다.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "특별한 발견", e: "✨🥕💫🌟", tx: "강을 건넌 후, 그들은 황금 꽃으로 가득한 마법의 공터를 찾았습니다. 중앙에는 토끼의 당근이 황금빛으로 빛나고 있었습니다. \"거기다!\", 토끼가 외치며 그쪽으로 달려갔습니다.", m: "🎯 잃어버린 것들은 우리가 찾는 것을 멈추고 여행을 즐길 때 종종 발견됩니다.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "행복한 결말", e: "🦊🐰🥕🌅❤️", tx: "해가 지평선에 지고 있을 때, 리나와 토끼는 가지 위에 함께 앉았습니다. \"나의 친구가 되어줘서 고마워요\", 토끼가 리나를 안으며 말했습니다. \"오늘 정말 용감했어요\". 그리고 리나는 미소 지었습니다. 그녀는 당근보다 더 소중한 무언가를 발견했다는 것을 알았습니다: 진정한 우정!", m: "💝 진정한 마법은 숲에 있지 않고 우리 친구들의 마음에 있습니다.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "끝!", fin_l: ["✨ 두려워도 용감하세요", "🤝 대가를 바라지 말고 남을 도우세요", "💪 문제는 함께 푸는 것이 낫습니다", "🌈 진정한 모험은 우정 속에 있습니다"]},
            vi: { t: "Lina và Khu Rừng Thần Kỳ", s: "Một cuộc phiêu lưu của tình bạn và can đảm", c: [
                { n: "Sự Khám Phá", e: "🦊🏠", tx: "Lina là một chú cáo đỏ nhỏ sống ở rìa khu rừng. Mỗi sáng cô nhìn ra từ lỗ của mình, nhưng cô sợ hơi một chút khi khám phá nơi này không quen thuộc và rộng lớn.", m: "✨ Đôi khi, những gì làm chúng ta sợ chính là những gì chúng ta cần khám phá.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Bước Đầu Tiên", e: "🦊👣🌳", tx: "Một ngày nọ, Lina lấy hơi sâu và quyết định bước vào rừng. Những bàn chân nhỏ của cô kêu xét xát trên những lá khô. Ánh sáng vàng của mặt trời lọc qua các cây. Nó thật tuyệt vời!", m: "💪 Dũng cảm không có nghĩa là không có sợ hãi, nó có nghĩa là hành động mặc dù sợ hãi.", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "Một Người Bạn Mới", e: "🐰🦊💛", tx: "Bên cạnh một cây khổng lồ, Lina tìm thấy Thỏ, người đang khóc. \"Tôi đã mất cây cà rốt vàng của tôi!\", Thỏ nói giữa những tiếng khóc. Không suy nghĩ gì, Lina nói: \"Tôi sẽ giúp bạn tìm nó!\"", m: "🤝 Giúp đỡ người khác là điều làm nên những người bạn thật sự.", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "Cuộc Phiêu Lưu Bắt Đầu", e: "🦊🐰🗺️✨", tx: "Cùng nhau, họ đi sâu hơn vào rừng. Họ qua những dòng suối trong vắt, dưới những cây cầu dây leo và giữa những bông hoa sáng. Mỗi bước là một bất ngờ mới. \"Nhìn này, Lina! Điều này thật tuyệt vời!\", Thỏ hô vui vẻ.", m: "🌈 Những khoảnh khắc đặc biệt trở nên đặc biệt hơn khi chúng ta chia sẻ với bạn bè.", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "Thách Thức", e: "🦊😰❓", tx: "Đột nhiên, họ đến một con sông rộng và chảy xiết. \"Chúng ta sẽ vượt qua như thế nào?\", Thỏ hỏi sợ hãi. Lina nhìn quanh... và thấy những viên đá lớn trong nước. \"Chúng ta sẽ nhảy từ viên đá này sang viên đá khác!\", cô đề xuất tự tin.", m: "🧠 Khi không có giải pháp, hãy nhìn kỹ hơn. Luôn có một cách.", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "Làm Việc Cùng Nhau", e: "🦊🐰🤝💪", tx: "Lina nhảy trước tiên lên viên đá đầu tiên. \"Nào, Thỏ! Cậu có thể làm được!\" Thỏ nhảy, hơi sợ hãi, nhưng Lina đưa cho nó lапá để giúp. Cùng nhau, viên đá này sang viên đá khác, họ vượt qua con sông. \"Chúng ta đã làm được!\", họ ăn mừng.", m: "👥 Người mạnh nhất không phải là người có thể làm tất cả một mình, mà là người tạo thành một đội.", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },
                { n: "Khám Phá Đặc Biệt", e: "✨🥕💫🌟", tx: "Sau khi vượt qua con sông, họ tìm thấy một khoảng trống thần kỳ đầy những bông hoa vàng. Ở giữa, cà rốt của Thỏ tỏa sáng, được bao quanh bởi ánh sáng vàng. \"Nó ở đó!\", Thỏ kéu lên chạy về phía nó.", m: "🎯 Những thứ bị mất thường được tìm thấy khi chúng ta ngừng tìm kiếm và tận hưởng cuộc hành trình.", img: "https://images.unsplash.com/photo-1490097281087-84e8b36b735d?w=600&h=400&fit=crop" },
                { n: "Kết Thúc Vui Vẻ", e: "🦊🐰🥕🌅❤️", tx: "Khi mặt trời lặn trên chân trời, Lina và Thỏ ngồi cùng nhau trên một cây cành. \"Cảm ơn vì là bạn tôi\", Thỏ nói ôm Lina. \"Cậu rất can đảm hôm nay\". Và Lina cười, biết rằng cô đã khám phá ra cái gì đó quý giá hơn bất kỳ cà rốt nào: một tình bạn thật sự!", m: "💝 Phép thuật thực sự không nằm trong rừng, mà nằm trong trái tim những người bạn của chúng ta.", img: "https://images.unsplash.com/photo-1495567720989-cebdbdd97913?w=600&h=400&fit=crop" }
            ], fin_titulo: "KẾT THÚC!", fin_l: ["✨ Hãy can đảm ngay cả khi sợ", "🤝 Giúp đỡ người khác không mong đợi gì", "💪 Vấn đề được giải quyết tốt hơn khi cùng nhau", "🌈 Những cuộc phiêu lưu thực sự nằm trong tình bạn"]},
            th: { t: "ลีน่าและป่าวิเศษ", s: "การผจญภัยของมิตรภาพและความกล้าหาญ", c: [
                { n: "การค้นพบ", e: "🦊🏠", tx: "ลีน่าเป็นจิ้งจอกแดงตัวเล็กที่อาศัยอยู่ที่ขอบป่า ทุกเช้าเธอมองออกมาจากนอน แต่เธอกลัวที่จะสำรวจสถานที่ใหญ่และแปลกใหม่นี้เล็กน้อย", m: "✨ บางครั้ง สิ่งที่ทำให้เรากลัวคือสิ่งที่เราต้องค้นพบ", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "ก้าวแรก", e: "🦊👣🌳", tx: "วันหนึ่ง ลีน่าหายใจเข้าลึกและตัดสินใจเดินเข้าไปในป่า เท้าเล็กน้อยของเธอสั่นไหวในใบไม้แห้ง แสงสีทองของดวงอาทิตย์กรองผ่านต้นไม้ มันสวยมาก", m: "💪 ความกล้าหาญไม่ได้หมายความว่าไม่มีความกลัว แต่หมายความว่าต้องกระทำแม้จะมีความกลัว", img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=400&fit=crop" },
                { n: "เพื่อนใหม่", e: "🐰🦊💛", tx: "ข้างต้นไม้ใหญ่โตแฟ้บ ลีน่าพบกระต่ายที่กำลังร้องไห้ \"ฉันเสียแครอททองของฉัน\" กระต่ายเศร้าโศก โดยไม่ลังเล ลีน่ากล่าว \"ฉันจะช่วยคุณหาให้\"", m: "🤝 การช่วยเหลือผู้อื่นคือสิ่งที่ทำให้เกิดเพื่อนแท้", img: "https://images.unsplash.com/photo-1458720354765-ce34ab761c98?w=600&h=400&fit=crop" },
                { n: "การผจญภัยเริ่มต้น", e: "🦊🐰🗺️✨", tx: "พวกเขาไปสำรวจลึกเข้าไปในป่า พวกเขาผ่านลำธารเล่มน้ำใส บริเวณใต้สะพานเถาวัลย์ และท่ามกลางดอกไม้สว่างใจ ทุกก้าวเป็นสิ่งประหลาดใหม่ \"ดูสิ ลีน่า นี่มันวิเศษ\" กระต่ายร้องเพลินใจ", m: "🌈 ช่วงเวลาพิเศษจะพิเศษมากขึ้นเมื่อเราแบ่งปันกับเพื่อน", img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=400&fit=crop" },
                { n: "ความท้าทาย", e: "🦊😰❓", tx: "ทันใดนั้น พวกเขามาถึงแม่น้ำกว้างและไหลเชื่อม \"เราจะข้ามไปได้ไหม\" กระต่ายถามด้วยความกลัว ลีน่ามองรอบด้าน และเห็นหินใหญ่ในน้ำ \"เราจะกระโดดจากหินลงหินไป\" เธอเสนออย่างเต็มใจ", m: "🧠 เมื่อดูเหมือนไม่มีวิธีแก้ไข ให้มองดูให้ดี มีวิธีเสมอ", img: "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=600&h=400&fit=crop" },
                { n: "ทำงานร่วมกัน", e: "🦊🐰🤝💪", tx: "ลีน่าโดดขึ้นหินก้อนแรก \"ไป กระต่าย คุณทำได้\" กระต่ายโดด แต่หวาดระแวง แต่ลีน่าให้เท้าช่วยเหลือ พวกเขาข้ามแม่น้ำไปพร้อมกัน \"เราทำสำเร็จ\" พวกเขาฉลองยินดี", m: "👥 คนที่แข็งแกร่งที่สุดไม่ใช่คนที่ทำได้ทั้งหมดคนเดียว แต่คนที่ทำงานเป็นทีม", img: "https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=600&h=400&fit=crop" },

        const languages = ['id', 'tl', 'pl', 'tr', 'nl', 'sv', 'no', 'da', 'el', 'fi', 'uk'];
        languages.forEach(lang => {
            if (!historias[lang]) {
                historias[lang] = JSON.parse(JSON.stringify(historias.en));
            }
        });

        function renderLibro(idioma) {
            const historia = historias[idioma] || historias.en;
            let html = `<div class="libro">
                <div class="portada">
                    <div class="decoracion decoracion-top-left">🌲</div>
                    <div class="decoracion decoracion-bottom-right">🦊</div>
                    <h1>🌲 ${historia.t} 🌲</h1>
                    <div class="ilustracion">🦊✨🌟</div>
                    <p>${historia.s}</p>
                </div>`;

            historia.c.forEach((cap, idx) => {
                html += `<div class="pagina">
                    <div class="decoracion decoracion-top-left">✨</div>
                    <div class="decoracion decoracion-bottom-right">🌿</div>
                    <div class="contenido">
                        <h2 class="titulo-capitulo">${cap.n}</h2>
                        <div class="ilustracion-contenedor">${cap.e}</div>
                        ${cap.img ? `<img src="${cap.img}" alt="${cap.n}" class="imagen-ia" onerror="this.style.display='none'">` : ''}
                        <div class="texto">${cap.tx}</div>
                        <div class="moral">${cap.m}</div>
                    </div>
                    <div class="numero-pagina">Página ${idx + 1}</div>
                </div>`;
            });

            html += `<div class="pagina fin-page">
                <div class="decoracion decoracion-top-left">🌲</div>
                <div class="decoracion decoracion-bottom-right">🦊</div>
                <div class="contenido" style="width: 100%;">
                    <div class="ilustracion-final">🦊🐰✨💛🌲</div>
                    <h2 class="titulo-fin">${historia.fin_titulo || '¡FIN!'}</h2>
                    <div class="lecciones">
                        ${(historia.fin_l || ['✨ Sé valiente aunque tengas miedo', '🤝 Ayuda a otros sin esperar nada a cambio', '💪 Los problemas se resuelven mejor juntos', '🌈 Las aventuras reales están en la amistad']).map(l => `<p><strong>${l}</strong></p>`).join('')}
                    </div>
                </div>
            </div></div>`;

            document.getElementById('libro-container').innerHTML = html;
        }

        function cambiarIdioma(idioma) {
            renderLibro(idioma);
            window.scrollTo(0, 0);
        }

        function descargarPDF() {
            const idioma = document.getElementById('idioma-select').value;
            const historia = historias[idioma] || historias.en;
            const nombreArchivo = `lina-bosque-magico_${idioma}.pdf`;
            window.print();
        }

        renderLibro('es');
    </script>
